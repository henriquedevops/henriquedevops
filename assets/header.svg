<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-labelledby="title desc">
  <title id="title">Henrique — Machine Learning Engineer · MLOps</title>
  <desc id="desc">Banner do perfil com uma rede neural animada: Machine Learning Engineer, MLOps, observabilidade de modelos e LLMs locais.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06080f"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <radialGradient id="glowP" cx="0.12" cy="0.1" r="0.55">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="0.88" cy="0.95" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="name" gradientUnits="userSpaceOnUse" x1="60" y1="0" x2="420" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#e9d5ff"/>
      <stop offset="0.45" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#22d3ee"/>
      <animate attributeName="x1" values="60;420;60" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="420;780;420" dur="9s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="netG" gradientUnits="userSpaceOnUse" x1="690" y1="0" x2="930" y2="0">
      <stop offset="0" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a855f7"/>
      <stop offset="0.5" stop-color="#c084fc"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="scanG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22d3ee" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#30363d" stroke-width="0.7"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0.08"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.85"/>
    </linearGradient>
    <mask id="gridMask"><rect width="1000" height="260" fill="url(#fade)"/></mask>
    <filter id="glow" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><rect width="1000" height="260" rx="18"/></clipPath>
  </defs>
  <style>
    .mono{font-family:'JetBrains Mono','Fira Code','Cascadia Code',Consolas,'Courier New',monospace}
    .sans{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Helvetica,Arial,sans-serif}
    .node{animation:pulse 3s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
    .scan{animation:scan 7s linear infinite}
    @keyframes scan{from{transform:translateY(-70px)}to{transform:translateY(270px)}}
    .flow{fill:none;stroke:url(#netG);stroke-width:2;stroke-linecap:round;stroke-dasharray:6 14;animation:flow 2.4s linear infinite}
    @keyframes flow{to{stroke-dashoffset:-40}}
  </style>

  <g clip-path="url(#clip)">
    <rect width="1000" height="260" fill="url(#bg)"/>
    <rect width="1000" height="260" fill="url(#glowP)"/>
    <rect width="1000" height="260" fill="url(#glowC)"/>
    <rect width="1000" height="260" fill="url(#grid)" mask="url(#gridMask)"/>
    <rect class="scan" x="0" y="0" width="1000" height="70" fill="url(#scanG)"/>

    <!-- texto -->
    <text x="60" y="66" class="mono" font-size="15" fill="#22d3ee">~/henriquedevops $ <tspan fill="#e6edf3">whoami</tspan> <tspan fill="#22d3ee">█<animate attributeName="fill-opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/></tspan></text>
    <text x="58" y="142" class="sans" font-size="76" font-weight="800" letter-spacing="-1" fill="url(#name)" filter="url(#glow)">Henrique</text>
    <text x="60" y="184" class="sans" font-size="22" font-weight="600" fill="#e6edf3">Machine Learning Engineer <tspan fill="#a855f7">·</tspan> MLOps</text>
    <text x="60" y="214" class="sans" font-size="16" fill="#8b949e">Observabilidade de modelos <tspan fill="#22d3ee">·</tspan> LLMs locais <tspan fill="#22d3ee">·</tspan> Self-hosted</text>

    <!-- rede neural: conexões -->
    <path fill="none" stroke="#8b949e" stroke-opacity="0.16" stroke-width="1" d="M690 80L770 50M690 80L770 90M690 80L770 130M690 80L770 170M690 80L770 210M690 130L770 50M690 130L770 90M690 130L770 130M690 130L770 170M690 130L770 210M690 180L770 50M690 180L770 90M690 180L770 130M690 180L770 170M690 180L770 210M770 50L850 50M770 50L850 90M770 50L850 130M770 50L850 170M770 50L850 210M770 90L850 50M770 90L850 90M770 90L850 130M770 90L850 170M770 90L850 210M770 130L850 50M770 130L850 90M770 130L850 130M770 130L850 170M770 130L850 210M770 170L850 50M770 170L850 90M770 170L850 130M770 170L850 170M770 170L850 210M770 210L850 50M770 210L850 90M770 210L850 130M770 210L850 170M770 210L850 210M850 50L930 105M850 50L930 155M850 90L930 105M850 90L930 155M850 130L930 105M850 130L930 155M850 170L930 105M850 170L930 155M850 210L930 105M850 210L930 155"/>

    <!-- rede neural: sinais fluindo -->
    <g filter="url(#soft)">
      <polyline class="flow" points="690,130 770,90 850,130 930,105"/>
      <polyline class="flow" style="animation-duration:3.1s" points="690,80 770,170 850,50 930,155"/>
      <polyline class="flow" style="animation-duration:2.7s" points="690,180 770,130 850,210 930,155"/>
    </g>

    <!-- rede neural: neurônios -->
    <g filter="url(#soft)" fill="#0d1117" stroke="url(#netG)" stroke-width="2">
      <g class="node"><circle cx="690" cy="80" r="7"/><circle cx="690" cy="80" r="2.5" fill="url(#netG)" stroke="none"/></g>
      <g class="node" style="animation-delay:.4s"><circle cx="690" cy="130" r="7"/><circle cx="690" cy="130" r="2.5" fill="url(#netG)" stroke="none"/></g>
      <g class="node" style="animation-delay:.8s"><circle cx="690" cy="180" r="7"/><circle cx="690" cy="180" r="2.5" fill="url(#netG)" stroke="none"/></g>

      <g class="node" style="animation-delay:.2s"><circle cx="770" cy="50" r="7"/><circle cx="770" cy="50" r="2.5" fill="url(#netG)" stroke="none"/></g>
      <g class="node" style="animation-delay:.9s"><circle cx="770" cy="90" r="7"/><circle cx="770" cy="90" r="2.5" fill="url(#netG)" stroke="none"/></g>
      <g class="node" style="animation-delay:1.4s"><circle cx="770" cy="130" r="7"/><circle cx="770" cy="130" r="2.5" fill="url(#netG)" stroke="none"/></g>
      <g class="node" style="animation-delay:.6s"><circle cx="770" cy="170" r="7"/><circle cx="770" cy="170" r="2.5" fill="url(#netG)" stroke="none"/></g>
      <g class="node" style="animation-delay:1.8s"><circle cx="770" cy="210" r="7"/><circle cx="770" cy="210" r="2.5" fill="url(#netG)" stroke="none"/></g>

      <g class="node" style="animation-delay:1.1s"><circle cx="850" cy="50" r="7"/><circle cx="850" cy="50" r="2.5" fill="url(#netG)" stroke="none"/></g>
      <g class="node" style="animation-delay:.3s"><circle cx="850" cy="90" r="7"/><circle cx="850" cy="90" r="2.5" fill="url(#netG)" stroke="none"/></g>
      <g class="node" style="animation-delay:2s"><circle cx="850" cy="130" r="7"/><circle cx="850" cy="130" r="2.5" fill="url(#netG)" stroke="none"/></g>
      <g class="node" style="animation-delay:.7s"><circle cx="850" cy="170" r="7"/><circle cx="850" cy="170" r="2.5" fill="url(#netG)" stroke="none"/></g>
      <g class="node" style="animation-delay:1.5s"><circle cx="850" cy="210" r="7"/><circle cx="850" cy="210" r="2.5" fill="url(#netG)" stroke="none"/></g>

      <g class="node" style="animation-delay:1.2s"><circle cx="930" cy="105" r="8"/><circle cx="930" cy="105" r="3" fill="url(#netG)" stroke="none"/></g>
      <g class="node" style="animation-delay:.5s"><circle cx="930" cy="155" r="8"/><circle cx="930" cy="155" r="3" fill="url(#netG)" stroke="none"/></g>
    </g>
    <text x="810" y="244" text-anchor="middle" class="mono" font-size="11" fill="#8b949e">model.fit(X, y)</text>

    <rect x="0" y="256" width="1000" height="4" fill="url(#line)"/>
  </g>
</svg>
