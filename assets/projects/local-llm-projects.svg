<svg xmlns="http://www.w3.org/2000/svg" width="480" height="240" viewBox="0 0 480 240" role="img" aria-labelledby="t">
  <title id="t">local-llm-projects — aprendizado com LLMs rodando localmente em hardware modesto, com Ollama e Llama 3</title>
  <defs>
