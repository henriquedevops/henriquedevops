      <stop offset="0" stop-color="#a855f7"/>
      <stop offset="0.5" stop-color="#30363d"/>
      <stop offset="1" stop-color="#f472b6"/>
      <animateTransform attributeName="gradientTransform" type="rotate" values="0 .5 .5;360 .5 .5" dur="10.5s" repeatCount="indefinite"/>
    </linearGradient>
