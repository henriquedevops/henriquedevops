      <stop offset="0" stop-color="#f472b6" stop-opacity=".16"/>
      <stop offset="1" stop-color="#f472b6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .m{font-family:'JetBrains Mono','Fira Code','Cascadia Code',Consolas,'Courier New',monospace}
    .s{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Helvetica,Arial,sans-serif}
  </style>
  <rect x="1" y="1" width="478" height="238" rx="14" fill="url(#bg)"/>
  <rect x="1" y="1" width="478" height="238" rx="14" fill="url(#gl)"/>
  <rect x="1" y="1" width="478" height="238" rx="14" fill="none" stroke="url(#bd)" stroke-width="1.5"/>

  <text x="28" y="40" class="m" font-size="11" letter-spacing="1.5" fill="#f9a8d4">LLM · IA LOCAL</text>
