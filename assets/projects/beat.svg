    <rect x="171" y="184" width="87" height="24" rx="12" fill="#22d3ee" fill-opacity=".1" stroke="#22d3ee" stroke-opacity=".5"/>
    <text x="214.5" y="200" fill="#a5f3fc">JavaScript</text>
