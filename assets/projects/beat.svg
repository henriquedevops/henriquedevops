<svg xmlns="http://www.w3.org/2000/svg" width="480" height="240" viewBox="0 0 480 240" role="img" aria-labelledby="t">
  <title id="t">beat — time tracker self-hosted com timers por projeto, relatórios e exportação CSV, em PHP, PostgreSQL e JavaScript</title>
  <defs>
    <linearGradient id="bd" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f472b6"/>
      <stop offset="0.5" stop-color="#30363d"/>
      <stop offset="1" stop-color="#22d3ee"/>
      <animateTransform attributeName="gradientTransform" type="rotate" values="0 .5 .5;360 .5 .5" dur="11.5s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#0b0f17"/>
    </linearGradient>
    <radialGradient id="gl" cx="1" cy="0" r="0.9">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".16"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .m{font-family:'JetBrains Mono','Fira Code','Cascadia Code',Consolas,'Courier New',monospace}
    .s{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Helvetica,Arial,sans-serif}
  </style>
  <rect x="1" y="1" width="478" height="238" rx="14" fill="url(#bg)"/>
  <rect x="1" y="1" width="478" height="238" rx="14" fill="url(#gl)"/>
  <rect x="1" y="1" width="478" height="238" rx="14" fill="none" stroke="url(#bd)" stroke-width="1.5"/>

  <text x="28" y="40" class="m" font-size="11" letter-spacing="1.5" fill="#22d3ee">SELF-HOSTED · WEB</text>
  <text x="438" y="40" text-anchor="end" class="m" font-size="11" fill="#8b949e">PHP · JavaScript</text>
  <circle cx="448" cy="36" r="4" fill="#4F5D95"/>

  <text x="28" y="76" class="s" font-size="22" font-weight="700" fill="#e6edf3">beat</text>
  <text class="s" font-size="14" fill="#8b949e">
    <tspan x="28" y="108">Time tracker self-hosted: timers por projeto, log</tspan>
    <tspan x="28" y="130">diário, relatórios e exportação em CSV, feito com</tspan>
